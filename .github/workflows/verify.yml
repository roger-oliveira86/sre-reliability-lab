name: Verify Python and manifests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Python tests
        run: |
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -v
      - name: Validate lab YAML syntax
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python3 - <<'PYCODE'
          from pathlib import Path
          import yaml
          paths = sorted(Path('k8s').glob('*.yaml'))
          assert len(paths) == 3, f'Expected 3 manifests; found {len(paths)}'
          for path in paths:
              document = yaml.safe_load(path.read_text())
              assert isinstance(document, dict) and document.get('apiVersion') and document.get('kind'), path
              print(f'YAML syntax OK: {path}')
          PYCODE
      - name: Validate Kubernetes schemas with Kubeconform
        shell: bash
        run: |
          set -euo pipefail
          version=v0.8.0
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/yannh/kubeconform/releases/download/$version/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform

          schema_commit=c416d7b0da0751bd8ebe5be4fa4c8e8274e3bbe2
          schema_url="https://raw.githubusercontent.com/yannh/kubernetes-json-schema/$schema_commit"
          "$RUNNER_TEMP/kubeconform" -strict -summary -n 1 -kubernetes-version 1.35.0 \
            -schema-location "$schema_url/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            k8s/namespace.yaml k8s/deployment.yaml k8s/service.yaml
      - name: Container build and local smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker build -t sre-lab-ci:pr .
          docker run --rm -d --name sre-lab-smoke -p 127.0.0.1:18080:8080 sre-lab-ci:pr
          trap 'docker rm -f sre-lab-smoke >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error               http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              ready=true
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' sre-lab-smoke)" != "true" ]; then
              echo "Container terminated during startup"
              docker logs sre-lab-smoke || true
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Application did not become healthy"
            docker logs sre-lab-smoke || true
            exit 1
          fi

          curl --fail --silent --show-error             http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error             http://127.0.0.1:18080/metrics > /tmp/sre-metrics.txt
          grep -q 'demo_http_requests_total' /tmp/sre-metrics.txt

      - name: Container vulnerability scan
        shell: bash
        run: |
          set -euo pipefail

          docker save -o "$RUNNER_TEMP/sre-lab-ci.tar" sre-lab-ci:pr

          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image \
            --input /scan/sre-lab-ci.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --exit-code 0 \
            > "$RUNNER_TEMP/trivy-report.json"

          python3 - "$RUNNER_TEMP/trivy-report.json" <<'PYCODE'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())

          results = report.get("Results")
          if not isinstance(results, list) or not results:
              sys.exit("Trivy returned an invalid or empty results list")

          findings = [
              vulnerability
              for result in report.get("Results", [])
              for vulnerability in result.get("Vulnerabilities", [])
          ]

          counts = Counter(
              vulnerability["Severity"]
              for vulnerability in findings
          )

          high = counts["HIGH"]
          critical = counts["CRITICAL"]

          summary = (
              f"Trivy: {high} HIGH, {critical} CRITICAL"
          )
          print(summary)

          with open(
              __import__("os").environ["GITHUB_STEP_SUMMARY"],
              "a",
          ) as summary_file:
              summary_file.write("### Container vulnerability scan\n")
              summary_file.write(f"{summary}\n")

          for finding in findings[:20]:
              print(
                  finding.get("VulnerabilityID", "unknown"),
                  finding.get("PkgName", "unknown"),
                  finding.get("Severity", "unknown"),
              )

          if critical:
              sys.exit("Critical vulnerabilities detected")
          PYCODE
