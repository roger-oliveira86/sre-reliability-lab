name: Publish container to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish OCI image
    if: github.ref == 'refs/heads/main' && github.repository == 'roger-oliveira86/sre-reliability-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build, authenticate and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPO,,}:sha-${COMMIT_SHA:0:12}"
          docker build --label "org.opencontainers.image.source=https://github.com/${REPO}" --label "org.opencontainers.image.revision=${COMMIT_SHA}" -t "$IMAGE" .
          # Scan the exact image built for publication.
          docker save -o "$RUNNER_TEMP/ghcr-image.tar" "$IMAGE"

          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image \
            --input /scan/ghcr-image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --exit-code 0 \
            > "$RUNNER_TEMP/ghcr-trivy.json"

          python3 - "$RUNNER_TEMP/ghcr-trivy.json" <<'PYCODE'
          import json
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          results = json.loads(Path(sys.argv[1]).read_text()).get("Results")
          if not isinstance(results, list) or not results:
              sys.exit("Invalid or empty Trivy results")

          counts = Counter(
              finding["Severity"]
              for result in results
              for finding in result.get("Vulnerabilities", [])
          )

          high = counts["HIGH"]
          critical = counts["CRITICAL"]
          summary = f"Trivy: {high} HIGH, {critical} CRITICAL"

          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"### Pre-publication security scan\n{summary}\n")

          if critical:
              sys.exit("Publication blocked: CRITICAL vulnerabilities detected")
          PYCODE

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$IMAGE" | tee /tmp/ghcr-push.log
          DIGEST="$(awk '/digest: sha256:/ { print $3 }' /tmp/ghcr-push.log | tail -n 1)"
          test -n "$DIGEST"
          echo "Image published: ghcr.io/${REPO,,}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable tag: ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
