apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-demo
  namespace: sre-reliability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reliability-demo
  template:
    metadata:
      labels:
        app: reliability-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/YOUR_USERNAME/sre-reliability-lab:VERSION
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
